name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"          # triggers on v1.0.0, v1.2.3, etc.

jobs:
  publish:
    name: Build & publish .vsix to Marketplace
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Package extension
        working-directory: vscode-extension
        run: npm run package
        # produces query-oracle-<version>.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-extension/*.vsix

      - name: Publish to VS Code Marketplace
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --pat "$VSCE_PAT"
        # Secret setup: Settings → Secrets → VSCE_PAT
        # Get a token at: https://dev.azure.com → Personal Access Tokens
        # Scope: Marketplace → Manage
