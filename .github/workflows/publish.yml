# Publish query-oracle to PyPI.
#
# Authentication: uses PYPI_API_TOKEN / TEST_PYPI_API_TOKEN secrets.
# Add them in: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   PYPI_API_TOKEN      — from pypi.org      → Account Settings → API tokens
#   TEST_PYPI_API_TOKEN — from test.pypi.org → Account Settings → API tokens
#
# Triggers:
#   - Push of a tag matching v* (e.g. git tag v0.4.0 && git push origin v0.4.0)
#   - Publishing a GitHub Release
#   - Manual run via Actions → Publish to PyPI → Run workflow

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
